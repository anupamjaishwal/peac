<template>
    <template if:true={showWarning}>
        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small">
            <span class="slds-assistive-text">Warning</span>
            <div style="white-space: pre-line;">
                {warningMessage}
            </div>
        </div>
    </template>

    <template if:true={showTable}>
        <div class="slds-box slds-m-bottom_small slds-theme_default">
            <div class="slds-p-bottom_x-small" style="background-color:white;">
                <h2 class="slds-text-heading_medium slds-text-title_bold">
                    Book To Infolease Status
                </h2>
            </div>

            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th><div class="slds-truncate">Created Date</div></th>
                        <th><div class="slds-truncate">Status</div></th>
                        <th><div class="slds-truncate">Error</div></th>
                        <th><div class="slds-truncate">Link</div></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><div class="slds-truncate">{createdDate}</div></td>
                        <td><div class="slds-truncate">{integrationStatus}</div></td>
                        <td><div class="slds-truncate">{infoleaseError}</div></td>
                        <td>
                            <template if:true={integrationLogUrl}>
                                <a href={integrationLogUrl} target="_blank">View</a>
                            </template>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </template>
</template>
