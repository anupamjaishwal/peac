<!-- sL_LookupPicklistLWC.html -->
<template>
    <div class="lookup-container">
        <label class={computedLabelClass}>
            <abbr if:true={_required} title="required" class="slds-required">*</abbr>
            {label}
        </label>

        <!-- Selected record pill -->
        <template if:true={selectedRecord}>
            <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right">
                <div class={pillClass}>
                    <span class="slds-pill__label">{selectedRecord.label}</span>
                    <!-- Hide the clear button when field is read-only (single program rule) -->
                    <template if:false={_disabled}>
                        <button
                            class="slds-button slds-button_icon slds-button_icon slds-pill__remove"
                            title="Remove"
                            onclick={handleClear}>
                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        </button>
                    </template>
                    <!-- Lock icon when read-only -->
                    <template if:true={_disabled}>
                    </template>
                </div>
            </div>
        </template>

        <!-- Search input (visible when no record is selected) -->
        <template if:false={selectedRecord}>
            <div class={dropdownClass}>
                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                    <lightning-icon
                        icon-name="utility:search"
                        size="x-small"
                        class="slds-input__icon slds-input__icon_right">
                    </lightning-icon>
                    <input
                        type="text"
                        class="slds-input slds-combobox__input"
                        placeholder={placeholder}
                        value={searchTerm}
                        oninput={handleInput}
                        onfocus={handleFocus}
                        onblur={handleBlur}
                        autocomplete="off"
                        disabled={_disabled}
                    />
                </div>

                <!-- Dropdown results -->
                <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" role="listbox">
                    <ul class="slds-listbox slds-listbox_vertical" role="presentation">

                        <template if:true={isLoading}>
                            <li class="slds-listbox__item">
                                <div class="slds-media slds-listbox__option">
                                    <lightning-spinner size="x-small" alternative-text="Loading"></lightning-spinner>
                                    <span class="slds-m-left_small">Searching...</span>
                                </div>
                            </li>
                        </template>

                        <template if:true={showNoFilterMsg}>
                            <li class="slds-listbox__item">
                                <span class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small slds-text-color_weak">
                                    {noFilterMessage}
                                </span>
                            </li>
                        </template>

                        <template if:true={hasResults}>
                            <template for:each={records} for:item="rec">
                                <li key={rec.id}
                                    class="slds-listbox__item"
                                    role="option"
                                    data-id={rec.id}
                                    data-label={rec.label}
                                    onmousedown={handleSelect}>
                                    <span class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta">
                                        <span class="slds-media__body">
                                            <span class="slds-listbox__option-text slds-listbox__option-text_entity">
                                                {rec.label}
                                            </span>
                                        </span>
                                    </span>
                                </li>
                            </template>
                        </template>

                        <template if:true={showNoResults}>
                            <li class="slds-listbox__item">
                                <span class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small slds-text-color_weak">
                                    No results found.
                                </span>
                            </li>
                        </template>

                    </ul>
                </div>
            </div>
        </template>

        <!-- Validation error message -->
        <template if:true={errorMessage}>
            <p class="slds-form-error">{errorMessage}</p>
        </template>
    </div>
</template>
