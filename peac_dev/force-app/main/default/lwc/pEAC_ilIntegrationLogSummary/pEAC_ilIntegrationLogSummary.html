<template>
    <template if:true={showComponent}>
        <div class="slds-box slds-theme_default slds-p-around_small">

            <!-- Title -->
            <div class="slds-text-title_bold slds-m-bottom_small">
                Status of buyouts submitted to InfoLease 
            </div>

            <!-- Error -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    <h2>{error}</h2>
                </div>
            </template>

            <!-- Table -->
            <template if:true={hasRows}>
                <!-- Scroll container -->
                <div class="peac-scroll">

                    <!-- Header row -->
                    <div class="slds-grid peac-header slds-p-vertical_xx-small slds-p-horizontal_small">
                        <div class="slds-col slds-size_4-of-12">Quote Buyout Type</div>
                        <div class="slds-col slds-size_3-of-12">Start Time</div>
                        <div class="slds-col slds-size_3-of-12">Status</div>
                        <div class="slds-col slds-size_2-of-12">Link</div>
                    </div>

                    <!-- Data rows -->
                    <template for:each={rowsWithFallback} for:item="r">
                        <div key={r.rowKey} class="slds-grid peac-row slds-p-vertical_xx-small slds-p-horizontal_small slds-border_bottom">
                            <div class="slds-col slds-size_4-of-12 slds-truncate" title={r.qbtDisplay}>
                                {r.qbtDisplay}
                            </div>

                            <div class="slds-col slds-size_3-of-12 slds-truncate" title={r.startTimeDisplay}>
                                {r.startTimeDisplay}
                            </div>

                            <div class="slds-col slds-size_3-of-12">
                                <span class={r.statusClass}>{r.statusDisplay}</span>
                            </div>

                            <div class="slds-col slds-size_2-of-12">
                                <a href={r.recordUrl} target="_blank" rel="noopener">View</a>
                            </div>
                        </div>
                    </template>

                </div>
            </template>

            <!-- Empty -->
            <template if:false={hasRows}>
                <div class="slds-text-color_weak">
                    No In Progress/Failed logs found for this time window.
                </div>
            </template>

        </div>
    </template>
</template>
